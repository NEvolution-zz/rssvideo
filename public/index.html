<body>
  <header class="toolbar">
    <button id="back-button" type="button" class="icon-button" hidden aria-label="Back">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Back</span>
    </button>
    <div class="search-wrap">

    </div>
  </header>

  </div>

    <thead>
      <tr><th></th><th>Title</th><th>Date</th></tr>
    </thead>
    <tbody id="video-table-body"></tbody>
  </table>

  <p id="empty-state" class="empty-state" hidden>No videos match your search.</p>

  <section id="player-panel" class="player-panel" hidden>
    <button id="player-close" class="icon-button">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Back to list</span>
    </button>
    <video id="player-video" controls></video>
    <p id="player-error" class="error" role="alert" hidden></p>
  </section>
